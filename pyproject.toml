[project]
name = "nlp-earnings-signal"
version = "0.1.0"
description = "Research code for nlp-earnings-signal"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.28",
    "tqdm>=4.65.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "statsmodels>=0.14.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
