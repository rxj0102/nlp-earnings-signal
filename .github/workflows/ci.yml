name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies (torch/transformers are stubbed in tests)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib seaborn yfinance requests tqdm pytest
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
